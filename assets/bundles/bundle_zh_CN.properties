unit.collaris.details = “*号角声* 爱丽丝加入了队伍。”\n天童•爱丽丝，成功骇入天帝系统的少女。\n原因未知？\n似乎有些可疑之处？
unit.toxopid.details = 完美战队队长空崎•日奈。\n她的团队购置了外星科技战争机器来强化格黑娜战力——或是为了推翻潘德米拉姆议会？谁知道呢。
unit.conquer.details = 潘德米拉姆议会带来了配备240mm巨炮的征服者坦克，\n代号CQR-1304，其弹幕可贯穿一切建筑。\n对此感兴趣的夏莱对策委员枣•伊吕波，正计划用它取代老旧的“虎丸”坦克。

