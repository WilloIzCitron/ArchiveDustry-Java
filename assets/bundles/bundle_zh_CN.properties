unit.collaris.details = "\*号角声\* 爱丽丝加入了队伍。"\n天童爱丽丝，入侵了天帝系统的少女。\n我也不知道为什么会这样……\n总觉得哪里怪怪的？
unit.toxopid.details = 格黑娜风纪委员会委员长，空崎日奈。\n她的部队刚购入了一台充满未来感的外星战争机器，用于维护治安并扩充格黑娜风纪委员会的军备火力。又或是为了推翻万魔殿？算了，无所谓了。
unit.conquer.details = 万魔殿带来了一辆搭载240mm主炮的巨型坦克，能倾泻出暴雨般的炮火。\n这辆坦克名为「征服者」，代号CQR-1304，可击穿一切建筑。\n枣伊吕波对这辆坦克很感兴趣，想用它取代老旧生锈的「虎丸」坦克。

