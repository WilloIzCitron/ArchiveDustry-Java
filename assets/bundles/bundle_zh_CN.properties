ba-caution = Caution
ba-caution-text = 安装Live2D资源包可能需要较高配置才能流畅运行。不建议在32位JRE/JDK环境下使用Live2D（记忆大厅）功能。\n需要网络连接以下载资源库中的资源包。\n若需本地安装，请在Mindustry数据目录创建“live2d”文件夹并放置资源包。\n自定义Live2D资源包指南请参阅模组GitHub文档。

