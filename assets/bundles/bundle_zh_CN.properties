ba-caution = 注意事项
ba-caution-text = 安装Live2D资源包会占用一定的系统资源，需设备性能支持才能流畅运行。\n不建议在32位JRE/JDK环境下启用Live2D（回忆大厅）功能。\n从仓库安装资源包需要联网。\n若不便联网，您也可以手动将资源包放入Mindustry数据目录下名为 live2d 的文件夹中。\n自定义Live2D资源包的制作说明可在本模组的GitHub仓库中查看。
