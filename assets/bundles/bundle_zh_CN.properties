tooltipInfo-0 = 模组安装警告：安装模组需谨慎，来自不可信来源的模组可能造成危险。建议通过GitHub核查模组源代码！
tooltipTitle-1 = Welcome to Mindustry.
tooltipInfo-1 = 欢迎来到Mindustry！\n新的夏莱成员到来啦！开始游戏前请先体验教程哦awa
tooltipTitle-2 = Serpulo
tooltipInfo-2 = 赛普罗(Serpulo)：这颗星球上除了被称为孢子的紫色生物外，别无其他生命形式
tooltipTitle-3 = Erekir
tooltipInfo-3 = 埃里克尔(Erekir)：星系中最炽热的行星，在这里你很快就会融化
tooltipTitle-4 = Don't Overdemand Your Silicon.
tooltipInfo-4 = 合理规划硅需求\n硅的供需平衡影响游戏进程，请确保供给充足或减少需求
tooltipTitle-5 = Crux
tooltipInfo-5 = 红队(Crux)\n为控制赛普罗星区而建立的阵营，必须击败他们才能统治行星
tooltipTitle-6 = Malis
tooltipInfo-6 = 紫队(Malis)\n埃里克尔上比红队(Crux)更先进的阵营，千万要小心应对！
tooltipTitle-7 = Neoplasia
tooltipInfo-7 = 瘤液(Neoplasia)：会通过侵蚀含水建筑摧毁基地的危险物质，务必远离核心区域！

