# TOOL TIP ATLAS

tooltipTitle-0 = Keep out from Installing Mods
tooltipInfo-0 = 安装模组存在风险，请勿安装来源不明的模组。\n建议前往GitHub查看模组的源代码！
tooltipTitle-1 = Welcome to Mindustry
tooltipInfo-1 = 哦，新的沙勒老师来了。\n开始游戏前建议先体验教程关卡。
tooltipTitle-2 = Serpulo
tooltipInfo-2 = 这颗星球上除了名为「孢子」的紫色物质外，不存在任何生命形态。
tooltipTitle-3 = Erekir
tooltipInfo-3 = 星系中温度最高的星球。\n待不了多久你就会被融化的……
tooltipTitle-4 = Don't Overdemand Your Silicon
tooltipInfo-4 = 硅的供需平衡会影响你的游戏体验。\n要么增加硅的产能，要么减少硅的消耗。
tooltipTitle-5 = Crux
tooltipInfo-5 = 盘踞在赛普罗的武装势力，负责驻守它们的区块。\n你必须击败它们才能掌控这颗星球。
tooltipTitle-6 = Malis
tooltipInfo-6 = 埃里克尔上存在着的科技水平远超Crux的势力。\n小心应对它们！
tooltipTitle-7 = Neoplasia
tooltipInfo-7 = 极具危险性的感染物质，会侵蚀并摧毁你的基地，让它们离核心区域远点！

sussy = 天帝的语音已被Key接管，你无法开关该单位的语音，设置了也没用 :)

