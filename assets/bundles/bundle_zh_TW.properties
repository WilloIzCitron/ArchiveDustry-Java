# TOOL TIP ATLAS

tooltipTitle-0 = Keep out from Installing Mods
tooltipInfo-0 = 安裝模組存在風險，請勿安裝來源不明的模組。\n建議前往GitHub查看模組的原始碼！
tooltipTitle-1 = Welcome to Mindustry
tooltipInfo-1 = 哦，新的沙勒老師來了。\n開始遊戲前建議先體驗教學關卡。
tooltipTitle-2 = Serpulo
tooltipInfo-2 = 這顆星球上除了名為「孢子」的紫色物質外，不存在任何生命形態。
tooltipTitle-3 = Erekir
tooltipInfo-3 = 星系中溫度最高的星球。\n待不了多久你就會被融化的……
tooltipTitle-4 = Don't Overdemand Your Silicon
tooltipInfo-4 = 矽的供需平衡會影響你的遊戲體驗。\n要麼增加矽的產能，要麼減少矽的消耗。
tooltipTitle-5 = Crux
tooltipInfo-5 = 盤踞在賽普羅的武裝勢力，負責駐守它們的區塊。\n你必須擊敗它們才能掌控這顆星球。
tooltipTitle-6 = Malis
tooltipInfo-6 = 埃里凱爾上存在著的科技水平遠超Crux的勢力。\n小心應對它們！
tooltipTitle-7 = Neoplasia
tooltipInfo-7 = 極具危險性的感染物質，會侵蝕並摧毀你的基地，讓它們離核心區域遠點！

sussy = 天帝的語音已被Key接管，你無法開關該單位的語音，設定了也沒用 :)

