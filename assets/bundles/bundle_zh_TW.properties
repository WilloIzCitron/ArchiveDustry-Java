ba-caution = Caution
ba-caution-text = 安裝Live2D資源包可能需要較高效能配置才能流暢執行。不建議在32位元JRE/JDK環境下使用Live2D（記憶大廳）功能。\n需要網路連線以下載資源庫中的資源包。\n若需本機安裝，請在Mindustry資料目錄建立「live2d」資料夾並放置資源包。\n自訂Live2D資源包指南請參閱模組GitHub文件。

