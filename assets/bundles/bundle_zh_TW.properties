unit.collaris.details = "\*號角聲\* 愛麗絲加入了隊伍。"\n天童愛麗絲，入侵了天帝系統的少女。\n我也不知道為什麼會這樣……\n總覺得哪裡怪怪的？
unit.toxopid.details = 格黑娜學園風紀委員會委員長，空崎陽奈。\n她的部隊剛購入了一台充滿未來感的外星戰爭機器，用於維護治安並擴充格黑娜學園風紀委員會的軍備火力。又或是為了推翻萬魔殿？算了，無所謂了。
unit.conquer.details = 萬魔殿帶來了一輛搭載240mm主炮的巨型坦克，能傾瀉出暴雨般的炮火。\n這輛坦克名為「征服者」，代號CQR-1304，可擊穿一切建築。\n棗伊呂波對這輛坦克很感興趣，想用它取代老舊生鏽的「虎丸」坦克。

