ba-caution = 注意事項
ba-caution-text = 安裝Live2D資源包會佔用一定的系統資源，需裝置效能支援才能流暢執行。\n不建議在32位元JRE/JDK環境下啟用Live2D（回憶大廳）功能。\n從倉庫安裝資源包需要連網。\n若不便連網，您也可以手動將資源包放入Mindustry資料目錄下名為 live2d 的資料夾中。\n自訂Live2D資源包的製作說明可在本模組的GitHub倉庫中查看。
