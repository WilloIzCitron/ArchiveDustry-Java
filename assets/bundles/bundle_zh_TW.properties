tooltipTitle-0 = 模組安裝警告
tooltipInfo-0 = 模組安裝警告：安裝模組需謹慎，來自不可信來源的模組可能造成危險。\n建議透過GitHub核查模組原始碼！
tooltipTitle-1 = 歡迎來到Mindustry
tooltipInfo-1 = 歡迎來到Mindustry\n新的夏萊成員到來啦！開始遊戲前請先體驗教學哦
tooltipTitle-2 = 賽普羅
tooltipInfo-2 = 賽普羅：這顆星球上除了被稱為孢子的紫色生物外，別無其他生命形式
tooltipTitle-3 = 埃里克爾
tooltipInfo-3 = 埃里克爾：星系中最熾熱的行星，在這裡你很快就會融化
tooltipTitle-4 = 合理規劃矽需求
tooltipInfo-4 = 合理規劃矽需求\n矽的供需平衡影響遊戲進程，請確保供給充足或減少需求
tooltipTitle-5 = Crux（紅隊）
tooltipInfo-5 = Crux（紅隊）\n為控制賽普羅星區而建立的陣營，必須擊敗他們才能統治行星
tooltipTitle-6 = Malis（紫隊）
tooltipInfo-6 = Malis（紫隊）\n埃里克爾上比Crux（紅隊）更先進的陣營，千萬要小心應對！
tooltipTitle-7 = 瘤液
tooltipInfo-7 = 瘤液：會透過侵蝕含水建築摧毀基地的危險物質，務必遠離核心區域！

sussy = 天帝已被Key控制，你無法停用/啟用該單位語音。這不會生效的 :)

