unit.天帝.details = 「*號角聲* 愛麗絲加入了隊伍。」\n天童•愛麗絲，成功駭入天帝系統的少女。\n原因未知？\n似乎有些可疑之處？
unit.toxopid.details = 完美戰隊隊長空崎•日奈。\n她的團隊購置了外星科技戰爭機器來強化格黑娜戰力——或是為了推翻潘德米拉姆議會？誰知道呢。
unit.conquer.details = 潘德米拉姆議會帶來了配備240mm巨炮的征服者坦克，\n代號CQR-1304，其彈幕可貫穿一切建築。\n對此感興趣的夏萊對策委員棗•伊呂波，正計劃用它取代老舊的「虎丸」坦克。

