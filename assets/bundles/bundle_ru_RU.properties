unit.collaris.details = "\*Фанфары\* Алиса присоединилась к команде."\nТендо Арису - девочка, которая взломала систему Коллариса.\nХм, почему?\nРазве это не странно?
unit.toxopid.details = Глава "Идеальной Команды", Сорасаки Хина.\n Её команда только купила футуристичную для увеличения безопасности и боевой мощи Армии "Идеальной Команды". Или же чтобы свергнуть общество "Пандемониум"? Неважно.
unit.conquer.details = Общество "Пандемониум" притащили гиганский танк с калибром 240мм, он может выстрелить целым фонтаном пуль. \nНазвание танка: "Завоеватель" Серийный номер: CQR-1304, он прошивает всё.\nНацуме Ироха, девочка котрая заинтересовалась "Завоевателем" чтобы заменить старый ржавый танк под названем "Торамару".

