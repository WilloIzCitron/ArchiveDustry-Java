# TOOL TIP ATLAS

tooltipTitle-0 = Осторожнее с установкой других модов
tooltipInfo-0 = Будьте аккуратны с установкой модов, опасно скачивать их из непроверенных источников.\nВсегда ищите исходник на GitHub
tooltipTitle-1 = Добро пожаловать в Mindustry
tooltipInfo-1 = Хм? Новый "Осколочный"?.\nСоветую пройти обучение до начала игры
tooltipTitle-2 = Серпуло
tooltipInfo-2 = Планета полностью лишенная какой-либо жизни. Единственное что там живет это споры
tooltipTitle-3 = Эрекир
tooltipInfo-3 = Из-за своей близости к звезде, планета имеет невероятную температуру.\nНаходясь на ней без нужных технологий, вы расплавитесь очень быстро
tooltipTitle-4 = Следите за переполнением кремния
tooltipInfo-4 = Производство наряду с потреблением кремния очень влияет на вашу игру.\nСледите чтобы кремния всегда хватало
tooltipTitle-5 = Крюксы (Суть)
tooltipInfo-5 = Господствующая на Серпуло фракция.\nЕсли хотите заполучить планету себе, придется противостоять им
tooltipTitle-6 = Малис
tooltipInfo-6 = Господствующая фракция Эрекира, технологии у нмих гораздо более продвинуты по сравнению с крюксами.\nБудьте очень осторожны
tooltipTitle-7 = Неоплазма
tooltipInfo-7 = Загадочная и опасная субстанция которая заражает всё собой, сильно реагирует с водой. Держите это подальше от ядра и всего что вам важно!

sussy = Колларис одержим Ключом, вы не можете выключить или включить его звук. Это не сработает :)

unit.crawler-legged.name = Ползун (Многоножка)
unit.crawler-legged.description = Бежит во врагов и самоуничтожается, мощно взрываясь
