ba-caution-text = Скачивание анимаций Live2D может требовать больше оперативной памяти.\nНе рекомендуется их приенять на 32-битных устройствах.\nТребуется интернет соединение чтобы их скачать.\nТакже можно установить всё вручную, закинув данные в папку "live2d", которую вы должны создать в директории игры.\nДокументация по вашему собственному набору анимаций Live2D доступна в репозитории мода.
